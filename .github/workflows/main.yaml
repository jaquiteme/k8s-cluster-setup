name: Check file formatting

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [$default-branch]

# workflow jobs
jobs:
  linting:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup terraform cli on agent
        uses: hashicorp/setup-terraform@v3

      - name: Running terraform format
        id: fmt
        run: terraform fmt -recursive -check -no-color ./terraform
